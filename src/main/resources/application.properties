# ---------------------------------------------------------------------------
# HTTP - o Render injeta a porta em PORT
# ---------------------------------------------------------------------------
%prod.quarkus.http.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Datasource
# Conexao real so em dev/prod. No perfil test o Dev Services injeta a conexao.
# (Uma propriedade vazia, ex. "%test.x=", APAGA o valor vindo do Dev Services.)
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
# Supabase via Session pooler (IPv4, compativel com Render). SSL obrigatorio.
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}?sslmode=require
%dev,prod.quarkus.datasource.username=${POSTGRES_USER}
%dev,prod.quarkus.datasource.password=${POSTGRES_PASSWORD}
%prod.quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:10}
quarkus.datasource.devservices.enabled=false
quarkus.datasource.health.enabled=true

quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=import.sql
# Producao: NUNCA drop-and-create por padrao (apagaria o banco a cada deploy).
%prod.quarkus.hibernate-orm.schema-management.strategy=${DB_SCHEMA_STRATEGY:update}
%prod.quarkus.hibernate-orm.sql-load-script=${DB_LOAD_SCRIPT:no-file}
%prod.quarkus.hibernate-orm.log.sql=false

# Tests use an isolated PostgreSQL container, never the local database.
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:17-alpine

quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# ---------------------------------------------------------------------------
# Redis cache: bounded lifetime also covers changes made outside this application.
# Host/senha so em dev/prod; no perfil test o Dev Services injeta a conexao.
# ---------------------------------------------------------------------------
%dev.quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
%dev.quarkus.redis.password=${REDIS_PASSWORD:}
# Upstash: TLS obrigatorio -> rediss://default:<senha>@<host>.upstash.io:6379
%prod.quarkus.redis.hosts=${REDIS_URL}
%prod.quarkus.redis.tls.enabled=true
quarkus.redis.timeout=3s
quarkus.redis.devservices.enabled=false
quarkus.cache.redis.prefix=painel-investimento:cache:{cache-name}
quarkus.cache.redis.expire-after-write=${CACHE_TTL:5m}
quarkus.cache.redis.telemetria.expire-after-write=${CACHE_TELEMETRIA_TTL:30s}
quarkus.cache.redis.invalidation-scan-size=100

%test.quarkus.redis.devservices.enabled=true
%test.quarkus.redis.devservices.image-name=redis:7.4-alpine

# JWT Configuration
mp.jwt.verify.issuer=caixaverso
# dev/test: par de chaves do classpath (somente desenvolvimento, nunca usado em prod).
%dev,test.mp.jwt.verify.publickey.location=publicKey.pem
%dev,test.smallrye.jwt.sign.key.location=privateKey.pem
# prod: conteudo PEM vem das variaveis de ambiente do Render
#   MP_JWT_VERIFY_PUBLICKEY -> mp.jwt.verify.publickey
#   SMALLRYE_JWT_SIGN_KEY   -> smallrye.jwt.sign.key
quarkus.http.auth.permission.unauthenticated.paths=/,/auth/login,/swagger-ui/*,/q/swagger-ui/*,/q/health/*
quarkus.http.auth.permission.unauthenticated.policy=permit
quarkus.http.auth.proactive=false