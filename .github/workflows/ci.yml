## CI (build + testes) e CD (deploy no Render) para a aplicacao Quarkus.

name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: oracle
          cache: maven

      - name: Build
        run: ./mvnw verify -B

  deploy:
    # So faz deploy em push na main (nunca em PR) e somente se o build passou.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger deploy no Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Aguardar boot e validar health
        run: |
          sleep 180
          curl -f https://painel-investimento.onrender.com/q/health/ready || exit 1